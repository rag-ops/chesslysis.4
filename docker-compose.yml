services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chesslysis
      POSTGRES_USER: chesslysis
      POSTGRES_PASSWORD: chesslysis_dev
    ports: ["5432:5432"]
    volumes: [chesslysis_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesslysis -d chesslysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chesslysis:chesslysis_dev@db:5432/chesslysis?schema=public
      STOCKFISH_PATH: /usr/games/stockfish
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["3000:3000"]

volumes:
  chesslysis_pg:
