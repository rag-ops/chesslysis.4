services:
  - type: web
    name: chesslysis
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ANALYSIS_WORKER_TOKEN
        generateValue: true
      - key: ANALYSIS_WORKER_ENABLED
        value: true
